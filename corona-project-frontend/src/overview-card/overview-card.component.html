<div class="card">
    <div class="card-title">
      {{ title }}
        <div class="info" *ngIf="info">
          <div class="info-icon">i</div>
          <div class="info-message-content">{{ info }}</div>
        </div>
    </div>
  
    <div class="card-main-data" *ngIf="mainData !== undefined">
      {{ mainData }}
    </div>
  
    <div class="card-data" *ngFor="let data of dataList">
      <span *ngIf="data.value !== undefined"><b>{{ data.value }}</b></span>
      <span>{{ data.label }}</span>
    </div>
  </div>
